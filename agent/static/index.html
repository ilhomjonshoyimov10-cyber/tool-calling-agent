<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool-Calling Agent</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262a33; --text: #e6e8ec; --muted: #8b92a0;
    --accent: #5eead4; --user: #1f2937; --ok: #4ade80; --err: #f87171;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .tools { color: var(--muted); font-size: 12px; }
  main { flex: 1; overflow-y: auto; padding: 20px; }
  .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 12px 14px; border-radius: 10px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .user { background: var(--user); align-self: flex-end; max-width: 80%; }
  .agent { background: var(--panel); border: 1px solid var(--line); }
  .error { border-color: var(--err); color: var(--err); }
  details { margin-top: 10px; font-size: 13px; color: var(--muted); }
  summary { cursor: pointer; user-select: none; }
  .step { margin-top: 8px; padding: 8px 10px; background: var(--bg); border-radius: 6px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; overflow-x: auto; }
  .step b.ok { color: var(--ok); } .step b.fail { color: var(--err); }
  .hints { display: flex; flex-wrap: wrap; gap: 8px; }
  .hints button { background: transparent; color: var(--accent); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .hints button:hover { border-color: var(--accent); }
  form { border-top: 1px solid var(--line); padding: 14px 20px; }
  form .wrap { flex-direction: row; gap: 10px; }
  textarea { flex: 1; resize: none; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; min-height: 44px; }
  textarea:focus { outline: none; border-color: var(--accent); }
  button.send { background: var(--accent); color: #0b1f1c; border: 0; border-radius: 10px; padding: 0 18px; font-weight: 600; cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: wait; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>Tool-Calling Agent</h1>
  <span class="tools" id="tools">loading tools…</span>
</header>
<main id="log">
  <div class="wrap" id="messages">
    <div class="hints" id="hints">
      <button>100 dollar bugun necha so'm?</button>
      <button>Samarqandda ertaga havo qanday bo'ladi?</button>
      <button>Juma kuni "hisobotni topshirish" vazifasini yuqori muhimlik bilan qo'sh</button>
      <button>Amir Temur haqida qisqacha ma'lumot ber</button>
      <button>If I save 1.5 million UZS a month for 18 months, how much is that in EUR?</button>
    </div>
  </div>
</main>
<form id="form">
  <div class="wrap">
    <textarea id="input" rows="1" placeholder="Savol yoki vazifa yozing… (Enter: yuborish, Shift+Enter: yangi qator)"></textarea>
    <button class="send" id="send" type="submit">Yuborish</button>
  </div>
</form>
<script>
  const messages = document.getElementById("messages");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let sessionId = null;

  fetch("/api/tools").then(r => r.json()).then(tools => {
    document.getElementById("tools").textContent = tools.length
      ? tools.map(t => t.name).join(" · ")
      : "no tools (LLM_API_KEY not configured)";
  });

  function bubble(cls, text) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    messages.appendChild(el);
    el.scrollIntoView({ behavior: "smooth", block: "end" });
    return el;
  }

  function renderSteps(container, data) {
    if (data.steps.length) {
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = `Agent steps: ${data.steps.length} tool call(s)`;
      details.appendChild(summary);
      for (const s of data.steps) {
        const step = document.createElement("div");
        step.className = "step";
        const name = document.createElement("b");
        name.className = s.ok ? "ok" : "fail";
        name.textContent = s.tool;
        step.appendChild(name);
        step.appendChild(document.createTextNode(
          ` ${JSON.stringify(s.arguments)}  ·  ${s.duration_ms} ms\n→ ${JSON.stringify(s.result, null, 1)}`));
        step.style.whiteSpace = "pre-wrap";
        details.appendChild(step);
      }
      container.appendChild(details);
    }
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${data.total_tokens} tokens` + (data.stopped_reason === "max_steps" ? " · step budget reached" : "");
    container.appendChild(meta);
  }

  async function ask(text) {
    document.getElementById("hints")?.remove();
    bubble("user", text);
    const pending = bubble("agent", "…");
    send.disabled = true;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || res.statusText);
      sessionId = data.session_id;
      pending.textContent = data.answer;
      renderSteps(pending, data);
    } catch (err) {
      pending.classList.add("error");
      pending.textContent = "Error: " + err.message;
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  document.getElementById("hints").addEventListener("click", e => {
    if (e.target.tagName === "BUTTON") ask(e.target.textContent);
  });
  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = "";
    ask(text);
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); }
  });
</script>
</body>
</html>
